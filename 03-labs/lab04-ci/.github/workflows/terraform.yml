name: terraform

on:
  pull_request:
    paths: ["infra/**", "policy/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/**", "policy/**", ".github/workflows/terraform.yml"]

permissions: {}

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "1.16.4"
  CONFTEST_VERSION: "0.71.1"
  CONFTEST_SHA256: "c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985"
  WORKDIR: infra/envs/dev

jobs:
  static:
    name: fmt / validate / lint / test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0

      - name: terraform fmt
        run: terraform fmt -check -recursive infra

      - name: terraform validate
        working-directory: ${{ env.WORKDIR }}
        run: |
          terraform init -backend=false
          terraform validate

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: terraform test (modules)
        run: |
          for m in infra/modules/*/; do
            (cd "$m" && terraform init -backend=false && terraform test)
          done

      - name: setup opa
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.22.4

      - name: opa unit tests
        run: opa test policy -v

  plan:
    name: plan + policy gate
    needs: static
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC -> AWS STS; plan role is read-only + state lock, trust policy pinned to this repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: install conftest (checksum-verified)
        run: |
          curl -sSfL -o conftest.tgz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          echo "${CONFTEST_SHA256}  conftest.tgz" | sha256sum -c -
          tar -xzf conftest.tgz conftest
          sudo install -m 0755 conftest /usr/local/bin/conftest

      - name: terraform plan
        working-directory: ${{ env.WORKDIR }}
        run: |
          terraform init -backend-config=backend.hcl
          terraform plan -lock-timeout=5m -out=tfplan
          terraform show -json tfplan > plan.json

      # Review finding H-02: approvers need the headline (and every destroy)
      # first; the full text is capped because job summaries have a size limit.
      - name: publish plan to job summary (what the approver reviews)
        working-directory: ${{ env.WORKDIR }}
        run: |
          count() { jq --arg a "$1" '[.resource_changes[] | select(.change.actions | index($a))] | length' plan.json; }
          adds=$(count create); changes=$(count update); destroys=$(count delete)
          {
            echo "### terraform plan: ${adds} to add, ${changes} to change, ${destroys} to destroy"
            if [ "$destroys" -gt 0 ]; then
              echo '> [!WARNING]'
              echo "> ${destroys} resource(s) will be destroyed or replaced:"
              jq -r '.resource_changes[] | select(.change.actions | index("delete")) | "> - `\(.address)` (\(.change.actions | join("/")))"' plan.json
            fi
            echo '<details><summary>Full plan (first 400 lines)</summary>'
            echo
            echo '```'
            terraform show -no-color tfplan | head -n 400
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: policy gate (conftest)
        working-directory: ${{ env.WORKDIR }}
        run: conftest test --policy "$GITHUB_WORKSPACE/policy" --all-namespaces plan.json

      # NOTE: a saved plan file contains sensitive values in plaintext. Keep the repo
      # private, retention minimal, and never put secrets in Terraform variables
      # that land in state/plan (see 05-ai-review-log finding F-10).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ github.sha }}
          path: |
            ${{ env.WORKDIR }}/tfplan
            ${{ env.WORKDIR }}/plan.json
          retention-days: 1

  apply:
    name: apply (approved plan only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-24.04
    environment: dev # required reviewers configured on this environment = human approval gate
    permissions:
      contents: read
      id-token: write # OIDC -> AWS STS; apply role trust policy allows only environment:dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ github.sha }}
          path: ${{ env.WORKDIR }}

      - name: terraform apply (saved plan)
        working-directory: ${{ env.WORKDIR }}
        run: |
          terraform init -backend-config=backend.hcl
          terraform apply -lock-timeout=5m tfplan
